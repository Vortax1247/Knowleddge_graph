# =============================================================================
# domains.yaml — Domaines de connaissance du métier Data Scientist
# =============================================================================
# Chaque domaine représente un grand champ d'expertise auquel se rattachent
# skills, missions, algorithms, libraries, etc. via relations.yaml
# =============================================================================

Data Science:
  aliases:
    - DS
    - Science des données
  description: >
    Discipline transverse combinant statistiques, programmation et expertise
    métier pour extraire de la valeur et des insights à partir de données.
  parent: null
  sub_domains:
    - Machine Learning
    - Data Engineering
    - Data Analysis
    - Statistics
  level: all

Machine Learning:
  aliases:
    - ML
    - Apprentissage automatique
  description: >
    Ensemble de méthodes permettant à des systèmes d'apprendre des motifs à
    partir de données sans être explicitement programmés pour chaque règle.
  parent: Data Science
  sub_domains:
    - Deep Learning
    - Reinforcement Learning
    - Supervised Learning
    - Unsupervised Learning
  level: intermediate

Deep Learning:
  aliases:
    - DL
    - Apprentissage profond
  description: >
    Sous-domaine du Machine Learning fondé sur les réseaux de neurones
    profonds, particulièrement performant sur données non structurées
    (images, texte, son).
  parent: Machine Learning
  sub_domains:
    - Computer Vision
    - Natural Language Processing
  level: advanced

Natural Language Processing:
  aliases:
    - NLP
    - Traitement du langage naturel
    - TALN
  description: >
    Domaine dédié à l'analyse, la compréhension et la génération de langage
    humain par des machines (texte et parole).
  parent: Deep Learning
  sub_domains: []
  level: advanced

Computer Vision:
  aliases:
    - CV
    - Vision par ordinateur
  description: >
    Domaine dédié à l'extraction d'informations à partir d'images et de
    vidéos (classification, détection, segmentation).
  parent: Deep Learning
  sub_domains: []
  level: advanced

Data Engineering:
  aliases:
    - DE
    - Ingénierie des données
  description: >
    Conception et industrialisation des pipelines de collecte, stockage et
    transformation de données à grande échelle.
  parent: Data Science
  sub_domains:
    - Big Data
    - MLOps
  level: intermediate

Big Data:
  aliases:
    - Données massives
  description: >
    Traitement de volumes de données dépassant les capacités des outils
    traditionnels (volume, vélocité, variété).
  parent: Data Engineering
  sub_domains: []
  level: advanced

MLOps:
  aliases:
    - ML Engineering
    - Machine Learning Operations
  description: >
    Ensemble de pratiques d'industrialisation, de déploiement, de monitoring
    et de maintenance des modèles de Machine Learning en production.
  parent: Data Engineering
  sub_domains: []
  level: advanced

Data Analysis:
  aliases:
    - Analyse de données
    - Data Analytics
  description: >
    Exploration, nettoyage et interprétation de données pour répondre à des
    questions métier, souvent via des statistiques descriptives et de la
    visualisation.
  parent: Data Science
  sub_domains:
    - Business Intelligence
    - Data Visualization
  level: beginner

Business Intelligence:
  aliases:
    - BI
    - Aide à la décision
  description: >
    Ensemble d'outils et de méthodes permettant de restituer des indicateurs
    métier aux décideurs (tableaux de bord, reporting).
  parent: Data Analysis
  sub_domains: []
  level: beginner

Data Visualization:
  aliases:
    - DataViz
    - Visualisation de données
  description: >
    Représentation graphique de données pour en faciliter la compréhension
    et la communication.
  parent: Data Analysis
  sub_domains: []
  level: beginner

Statistics:
  aliases:
    - Statistiques
    - Inférence statistique
  description: >
    Fondements mathématiques permettant de décrire, résumer et inférer des
    conclusions à partir de données, incluant les tests d'hypothèses.
  parent: Data Science
  sub_domains: []
  level: intermediate

Time Series:
  aliases:
    - Séries temporelles
    - Forecasting
  description: >
    Analyse et prévision de données indexées dans le temps (ventes, trafic,
    signaux financiers, capteurs IoT).
  parent: Machine Learning
  sub_domains: []
  level: intermediate

Recommender Systems:
  aliases:
    - Systèmes de recommandation
  description: >
    Systèmes prédisant les préférences d'un utilisateur (filtrage
    collaboratif, filtrage basé contenu, systèmes hybrides).
  parent: Machine Learning
  sub_domains: []
  level: advanced

Reinforcement Learning:
  aliases:
    - RL
    - Apprentissage par renforcement
  description: >
    Paradigme d'apprentissage où un agent apprend une politique optimale par
    interaction avec un environnement et un système de récompense.
  parent: Machine Learning
  sub_domains: []
  level: advanced
